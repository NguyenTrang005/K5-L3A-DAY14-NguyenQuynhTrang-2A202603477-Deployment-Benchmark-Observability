services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10}
    depends_on:
      - redis
    stop_grace_period: 9s
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3
volumes:
  redis_data: